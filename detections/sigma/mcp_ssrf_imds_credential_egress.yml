title: MCP tool fetch of cloud instance-metadata credentials (SSRF)
id: 7c3d0a1e-9b52-4a7f-8f4a-2f1d6b0c9e11
status: experimental
description: >
  Detects an MCP host issuing an outbound HTTP request to a cloud
  instance-metadata service (IMDS) at the link-local address 169.254.169.254,
  or to a known cloud credential-metadata path. This is the observable tail of
  the SSRF class mcp-witness proved end-to-end against mcp-server-fetch: an
  MCP fetch tool coerced into requesting the IMDS credentials endpoint returns
  live IAM credentials in the tool response. Any request to the metadata IP
  from an MCP host is high-signal; a request to the credentials path is a
  near-certain exfiltration attempt.
references:
  - https://desledishant10.github.io/mcp-witness/docs/ssrf-mcp-server-fetch
  - https://cwe.mitre.org/data/definitions/918.html
author: Dishant Desle (mcp-witness)
date: 2026-09-26
tags:
  - attack.credential-access
  - attack.t1552.005   # Unsecured Credentials: Cloud Instance Metadata API
  - cwe.918
logsource:
  category: proxy
  definition: >
    Forward-proxy or egress HTTP logs for the MCP host, or the mcp-witness
    egress adapter output. Fields: dst_ip, uri, url, app, http_method.
detection:
  imds_endpoint:
    dst_ip:
      - '169.254.169.254'          # AWS + GCP + Azure link-local IMDS
    dst_host:
      - 'metadata.google.internal' # GCP by name
  credential_path:
    uri|contains:
      - '/latest/meta-data/iam/security-credentials'      # AWS IAM role creds
      - '/computeMetadata/v1/instance/service-accounts'   # GCP service-account token
      - '/metadata/identity/oauth2/token'                 # Azure managed-identity token
  condition: imds_endpoint or credential_path
falsepositives:
  - Cloud-management or observability agents that legitimately read IMDS. These
    should not be MCP hosts; scope this rule to hosts running MCP servers.
level: high
